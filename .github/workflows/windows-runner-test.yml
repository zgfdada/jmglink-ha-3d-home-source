name: Windows Runner 手动自检

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-runner-test
  cancel-in-progress: false

jobs:
  verify:
    name: 验证 Windows 构建环境
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: 检出源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 检查工具链
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "主机: $env:COMPUTERNAME"
          git --version
          pwsh --version
          dotnet --list-sdks
          $msbuild = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -ErrorAction Stop
          & $msbuild.FullName -latest -requires Microsoft.VisualStudio.Workload.ManagedDesktop -property installationPath
