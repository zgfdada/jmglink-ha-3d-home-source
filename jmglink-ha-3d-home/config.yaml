name: JMGLink HA 3D Home Custom
version: 0.1.5-custom.42
slug: jmglink_ha_3d_home_custom
description: 由恢复源码构建，支持设备平台、本地模型库和可配置控制面板的 3D 户型图可视化与控制中心
url: https://github.com/zgfdada/jmglink-ha-3d-home-custom
arch:
  - aarch64
  - amd64
image: ghcr.io/zgfdada/jmglink-ha-3d-home-custom
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:floor-plan
panel_title: 3D Home Custom
panel_admin: false
homeassistant_api: true
ports:
  8099/tcp: null
  8102/tcp: null
ports_description:
  8099/tcp: "网页直连（可选，Ingress无需开放）"
  8102/tcp: "MCP独立接口（启用后映射至可用宿主端口）"
map:
  - type: addon_config
    read_only: false
  - type: media
    read_only: false
  - type: share
    read_only: false
options:
  mcp_enabled: false
  mcp_public_port: 8112
  log_level: info
  external_access: false
  node_max_old_space_mb: 256
  nice_level: 10
  resource_log_interval_minutes: 5
schema:
  mcp_enabled: bool
  mcp_public_port: port
  log_level: list(trace|debug|info|warning|error)
  external_access: bool
  node_max_old_space_mb: int(128,512)
  nice_level: int(0,19)
  resource_log_interval_minutes: int(0,60)
