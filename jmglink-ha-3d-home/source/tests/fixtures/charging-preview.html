<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3DHome · 车辆充电扫光预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e8ece8;color:#233b33;font-family:"Microsoft YaHei",sans-serif}header{position:absolute;top:38px;left:44px;z-index:1;pointer-events:none}header small{font-size:11px;letter-spacing:3px;color:#708679}h1{font-size:32px;line-height:1.5;margin:12px 0 8px;font-weight:550}header p{font-size:13px;color:#64796f;margin:0}#stage{width:calc(100vw - 335px);height:100vh;min-height:560px}canvas{display:block;touch-action:none}aside{position:absolute;right:24px;top:28px;bottom:28px;width:305px;border:1px solid #fff;background:#f5f7f0e8;border-radius:24px;padding:26px;box-shadow:0 12px 35px #3a514714;overflow:auto}aside h2{font-size:17px;font-weight:600;margin:0 0 8px}aside small{font-size:11px;color:#7d8b82;line-height:1.7;display:block}#status{margin:24px 0 15px;font-size:13px;font-weight:600;color:#21866b}.states{display:flex;gap:5px}.states button{flex:1;padding:10px 0;font-size:11px}button,select{border:1px solid #d9e2d8;background:#fff;color:#395449;border-radius:10px;padding:10px;font:inherit;cursor:pointer}.active{background:#d9f2e7;border-color:#7ac8a8}label{display:block;margin:20px 0 8px;font-size:12px;color:#5a7265}label span{float:right;font-variant-numeric:tabular-nums;color:#2a5443}select{width:100%;font-size:12px}input[type=range]{width:100%;accent-color:#299b78}input[type=color]{height:34px;width:100%;border:0;background:none}#pause{width:100%;margin-top:24px;font-size:12px}.foot{position:absolute;bottom:36px;left:44px;color:#75887d;font-size:11px;line-height:1.8}hr{border:0;border-top:1px solid #dce4d9;margin:24px 0}.note{font-size:11px;line-height:1.9;color:#78887d}@media(max-width:720px){header{top:20px;left:22px}h1{font-size:23px}#stage{width:100vw;height:60vh;min-height:380px}aside{position:relative;top:auto;right:auto;bottom:auto;margin:0 16px 20px;width:auto;padding:20px}.foot{display:none}}</style>
<header><small>3DHOME · MOTION STUDY</small><h1>让充电状态，流过车身。</h1><p>同一套部件动效引擎 · 表面扫光</p></header><div id="stage"></div>
<aside id="tweaks"><h2>车辆充电扫光</h2><small>程序化示例车辆 · 不读取或控制真实设备</small><div id="status">充电中 · 表面扫光</div><div class="states"><button data-state="charging" class="active">充电中</button><button data-state="idle">已停止</button><button data-state="offline">离线</button></div><hr>
<label for="variant">效果预设</label><select id="variant"><option value="reference">参考效果 · 青绿扫光</option><option value="soft">柔和 · 宽光带</option><option value="bright">明亮 · 快速窄光带</option></select>
<label for="speed">速度倍率<span id="speedValue">2</span></label><input id="speed" type="range" min="-6" max="6" step="0.25" value="2">
<label for="width">光带宽度<span id="widthValue">0.22</span></label><input id="width" type="range" min="0.02" max="0.6" step="0.01" value="0.22">
<label for="intensity">扫光强度<span id="intensityValue">1.8</span></label><input id="intensity" type="range" min="0" max="5" step="0.1" value="1.8">
<label for="color">光带颜色<span id="colorValue">#32efb0</span></label><input id="color" type="color" value="#32efb0">
<button id="pause">暂停预览</button><button id="midpoint" style="width:100%;margin-top:8px;font-size:12px">观察扫光中段</button><hr><p class="note">拖动车辆可旋转视角，滚轮缩放。负速度反向扫光。<br>实际使用时选择模型或车身部件，绑定真实的充电状态，再校验并保存规则。</p></aside>
<div class="foot">MODEL SURFACE SCAN / 局部 Z 轴<br>动态光带贴合模型表面，不改变设备点击范围。</div><script>/*CHARGING_DEMO*/</script></html>
